[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcatalyst"
version = "0.1.0"
description = "Mechanism-Aware Quantum-AI Triage for PETase Engineering"
readme = "README.md"
authors = [
    { name = "Q-Catalyst Team" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "biopython>=1.80",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "configs*", "protein_ai*", "uncertainty*", "acquisition*", "chemistry*", "quantum*", "fusion*", "benchmark*", "app*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
